version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: buildpermit-postgres
    restart: always
    environment:
      POSTGRES_USER: buildpermit
      POSTGRES_PASSWORD: buildpermit_password
      POSTGRES_DB: buildpermit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildpermit -d buildpermit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildpermit-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://buildpermit:buildpermit_password@db:5432/buildpermit_db
      SECRET_KEY: dev-production-secret-replace-me-123456789
      AI_ENABLED: "true"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "gemma4:e2b"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buildpermit-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
